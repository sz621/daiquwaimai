<style>

@keyframes toastIn { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }

.guide-steps { display: flex; flex-direction: column; gap: 12px; margin-bottom: 16px; }

.guide-text { font-size: 14px; color: #1d1d1f; line-height: 1.4; }
.hidden { display: none !important; }
</style>

<body>

<header class="header">

<!-- LOGIN -->

<div class="toast-container" id="toastContainer"></div>
<div id="modalContainer"></div>

<script>
// ========== GITHUB CONFIG ==========
const REPO = 'sz621/daiquwaimai';
const DATA_FILE = 'data.json';
const TOKEN = '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';

const RAW_URL = `https://raw.githubusercontent.com/${REPO}/main/${DATA_FILE}`;
const API_URL = `https://api.github.com/repos/${REPO}/contents/${DATA_FILE}`;

let dataStore = { users: {}, tasks: {}, notifs: {} };
let dataSHA = null;
let currentUserId = null;
let page = 'home', filter = 'all', myTab = 'posted';
let showingGuide = false;
let pollTimer = null;
let writeQueue = Promise.resolve();

// ========== HELPERS ==========
function uid() { return 'u' + Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function ago(ts) {
  if (!ts) return '';
  const s = (Date.now() - ts) / 1000;
  if (s < 60) return '刚刚';
  if (s < 3600) return Math.floor(s/60) + '分钟前';
  if (s < 86400) return Math.floor(s/3600) + '小时前';
  const d = new Date(ts);
  return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}
function toast(msg) {
  const el = document.createElement('div'); el.className = 'toast'; el.textContent = msg;
  document.getElementById('toastContainer').appendChild(el);
  setTimeout(() => el.remove(), 2200);
}
function modal(title, msg, actions) {
  document.getElementById('modalContainer').innerHTML = `
    <div class="modal-mask" onclick="closeModal()">
      <div class="modal-box" onclick="event.stopPropagation()">
        <h3>${title}</h3><p>${msg}</p>
        <div class="modal-actions">${actions.map(a =>
          `<button class="btn ${a.cls||'btn-secondary'}" onclick="closeModal();(${a.fn.toString()})();">${a.text}</button>`
        ).join('')}</div>
      </div></div>`;
}
function closeModal() { document.getElementById('modalContainer').innerHTML = ''; }

// ========== DATA LAYER ==========
async function loadData() {
  try {
    const cacheBuster = '?t=' + Date.now();
    const resp = await fetch(RAW_URL + cacheBuster);
    if (!resp.ok) {
      if (resp.status === 404) {
        // File doesn't exist yet — start fresh
        dataStore = { users: {}, tasks: {}, notifs: {} };
        dataSHA = null;
        return;
      }
      throw new Error('HTTP ' + resp.status);
    }
    const text = await resp.text();
    dataStore = JSON.parse(text);
    // Get SHA from API for writes
    try {
      const apiResp = await fetch(API_URL, { headers: { Authorization: 'Bearer ' + TOKEN } });
      if (apiResp.ok) {
        const info = await apiResp.json();
        dataSHA = info.sha;
      }
    } catch(e) {}
  } catch(e) {
    console.error('Data load error:', e);
  }
}

async function saveData() {
  // Serialize and do a sequential write
  return new Promise((resolve, reject) => {
    writeQueue = writeQueue.then(async () => {
      try {
        const content = JSON.stringify(dataStore, null, 2);
        const body = {
          message: 'Update data',
          content: btoa(unescape(encodeURIComponent(content))),
          branch: 'main'
        };
        if (dataSHA) body.sha = dataSHA;

        const resp = await fetch(API_URL, {
          method: 'PUT',
          headers: {
            Authorization: 'Bearer ' + TOKEN,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(body)
        });

        if (!resp.ok) {
          const err = await resp.json();
          // SHA conflict — reload and retry once
          if (err.message && err.message.includes('does not match')) {
            await loadData();
            body.sha = dataSHA;
            body.content = btoa(unescape(encodeURIComponent(JSON.stringify(dataStore, null, 2))));
            const retry = await fetch(API_URL, { method: 'PUT', headers: { Authorization: 'Bearer ' + TOKEN, 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
            if (retry.ok) {
              const info = await retry.json();
              dataSHA = info.content.sha;
            }
          }
          resolve();
          return;
        }

        const info = await resp.json();
        dataSHA = info.content.sha;
        resolve();
      } catch(e) {
        console.error('Save error:', e);
        resolve();
      }
    });
  });
}

// ========== LOGIN ==========
async function handleLogin() {
  const name = document.getElementById('loginName').value.trim();
  const phone = document.getElementById('loginPhone').value.trim();
  if (!name) return toast('请输入姓名');
  if (!/^\d{11}$/.test(phone)) return toast('请输入正确的11位手机号');

  const btn = document.getElementById('loginBtn');
  btn.disabled = true; btn.textContent = '连接中...';
  document.getElementById('statusMsg').textContent = '';

  try {
    await loadData();
    if (!dataStore.users) dataStore.users = {};
    if (!dataStore.tasks) dataStore.tasks = {};
    if (!dataStore.notifs) dataStore.notifs = {};

    // Find or create user
    let userKey = null;
    for (const [k, u] of Object.entries(dataStore.users)) {
      if (u.phone === phone) { userKey = k; break; }
    }

    const isNew = !userKey;
    if (isNew) {
      userKey = uid();
      dataStore.users[userKey] = { name, phone, points: 10, createdAt: Date.now() };
      // Welcome notification
      const nk = uid();
      dataStore.notifs[nk] = { userId: userKey, message: '🎉 欢迎加入代取外卖！已赠送你 10 积分', read: false, createdAt: Date.now() };
      await saveData();
      toast('注册成功，已送 10 积分！');
    } else {
      dataStore.users[userKey].name = name;
      await saveData();
      toast('欢迎回来，' + name);
    }

    currentUserId = userKey;
    localStorage.setItem('dqw_uid', currentUserId);

    document.getElementById('tabBar').classList.remove('hidden');
    document.getElementById('homePage').style.paddingBottom = '80px';
    document.getElementById('postPage').style.paddingBottom = '80px';
    document.getElementById('myPage').style.paddingBottom = '80px';
    document.getElementById('profilePage').style.paddingBottom = '80px';

    startPolling();
    go('home');
  } catch(e) {
    console.error(e);
    document.getElementById('statusMsg').textContent = '连接失败，请检查网络后重试';
    toast('连接失败');
  } finally {
    btn.disabled = false;
    btn.textContent = '登录 / 注册';
  }
}

// Auto-login
(async function() {
  const saved = localStorage.getItem('dqw_uid');
  if (saved) {
    try {
      await loadData();
      if (dataStore.users && dataStore.users[saved]) {
        currentUserId = saved;
        document.getElementById('tabBar').classList.remove('hidden');
        document.getElementById('homePage').style.paddingBottom = '80px';
        document.getElementById('postPage').style.paddingBottom = '80px';
        document.getElementById('myPage').style.paddingBottom = '80px';
        document.getElementById('profilePage').style.paddingBottom = '80px';
        startPolling();
        go('home');
      } else {
        localStorage.removeItem('dqw_uid');
      }
    } catch(e) {}
  }
})();

function startPolling() {
  if (pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(async () => {
    try {
      const prev = JSON.stringify(dataStore);
      await loadData();
      if (JSON.stringify(dataStore) !== prev) refresh();
    } catch(e) {}
  }, 3000);
}

// ========== NAVIGATION ==========
function go(p) {
  if (!currentUserId) return toast('请先登录');
  page = p;
  document.querySelectorAll('.page').forEach(x => x.classList.remove('active'));
  const el = document.getElementById(p + 'Page');
  if (el) el.classList.add('active');
  document.querySelectorAll('.tab-item').forEach(x => x.classList.remove('active'));
  const t = document.querySelector(`.tab-item[data-page="${p}"]`);
  if (t) t.classList.add('active');
  refresh();
}

function switchPage(p) { go(p); }
function refresh() { renderPage(page); updateBadge(); }
function renderPage(p) {
  if (p === 'home') renderHome();
  else if (p === 'post') renderPost();
  else if (p === 'my') renderMy();
  else if (p === 'profile') renderProfile();
}

// ========== HOME ==========
function setFilter(f) {
  filter = f;
  document.querySelectorAll('#platformFilter .segment-btn').forEach((b,i) => b.classList.toggle('active', i === (f==='all'?0:f==='eleme'?1:2)));
  renderHome();
}

function renderHome() {
  if (!currentUserId) return;
  const c = document.getElementById('taskList');
  const users = dataStore.users || {};
  let tasks = Object.entries(dataStore.tasks || {})
    .map(([id, t]) => ({ id, ...t }))
    .filter(t => t.status === 'open')
    .sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));

  if (filter !== 'all') tasks = tasks.filter(t => t.platform === filter);

  if (!tasks.length) {
    c.innerHTML = '<div class="empty"><div class="empty-icon">📭</div><div class="empty-title">暂无待取任务</div><div class="empty-desc">点击下方「发布」来发布第一个任务吧</div></div>';
    return;
  }

  c.innerHTML = tasks.map(t => {
    const poster = users[t.posterId] || {};
    const platCls = t.platform === 'eleme' ? 'tag-eleme' : 'tag-meituan';
    return `<div class="task-card">
      <div class="task-top">
        <span class="platform-tag ${platCls}">${t.platform==='eleme'?'🔵':'🟠'} ${t.platform==='eleme'?'饿了么':'美团'}</span>
        <span class="reward-badge">🪙 ${t.rewardPoints}</span>
      </div>
      <div class="task-detail">
        <span class="task-label">柜箱号</span><span class="task-value">${esc(t.lockerNumber)}</span>
        <span class="task-label">取件码</span><span class="task-value">${esc(t.pickupCode)}</span>
        <span class="task-label">手机号</span><span class="task-value">${esc(t.phone)}</span>
      </div>
      <div class="task-bottom">
        <span class="task-poster">👤 ${esc(poster.name||'...')}</span>
        <span class="task-time">${ago(t.createdAt)}</span>
        <button class="action-btn action-accept" onclick="acceptTask('${t.id}')">🤝 接单</button>
      </div></div>`;
  }).join('');
}

// ========== POST ==========
function renderPost() {
  if (!currentUserId) return;
  const u = (dataStore.users || {})[currentUserId];
  document.getElementById('pointsHint').textContent = `（可用：${u ? u.points : 0} 积分）`;
}

async function handlePost() {
  if (!currentUserId) return;
  const platform = document.getElementById('postPlatform').value;
  const lockerNumber = document.getElementById('postLocker').value.trim();
  const pickupCode = document.getElementById('postCode').value.trim();
  const phone = document.getElementById('postPhone').value.trim();
  const rewardPoints = parseInt(document.getElementById('postPoints').value) || 0;

  if (!lockerNumber) return toast('请输入柜箱号');
  if (!pickupCode) return toast('请输入取件码');
  if (!/^\d{11}$/.test(phone)) return toast('请输入正确的手机号');
  if (rewardPoints < 1) return toast('悬赏积分至少为 1');

  const u = (dataStore.users || {})[currentUserId];
  if (!u || rewardPoints > u.points) return toast(`积分不足！当前可用 ${u ? u.points : 0} 积分`);

  const taskId = uid();
  if (!dataStore.tasks) dataStore.tasks = {};
  dataStore.tasks[taskId] = {
    posterId: currentUserId, platform, lockerNumber, pickupCode, phone,
    rewardPoints, status: 'open', accepterId: null, createdAt: Date.now()
  };
  await saveData();
  toast('任务发布成功！📢');
  ['postLocker','postCode','postPhone'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('postPoints').value = '2';
  go('home');
}

// ========== ACCEPT / COMPLETE / CANCEL ==========
async function acceptTask(taskId) {
  if (!currentUserId) return;
  const t = (dataStore.tasks || {})[taskId];
  if (!t || t.status !== 'open') { toast('该任务已被接取'); return refresh(); }
  if (t.posterId === currentUserId) return toast('不能接自己发布的任务');

  modal('确认接单',
    `确认帮取？完成后获得 <strong style="color:#ff3b30;">${t.rewardPoints} 积分</strong><br><br>📦 ${t.lockerNumber}<br>🔢 ${t.pickupCode}`,
    [{ text:'取消', cls:'btn-secondary', fn:()=>{} },
     { text:'确认接单', cls:'btn-primary', fn: async () => {
       await loadData(); // Refresh before writing
       const task = (dataStore.tasks || {})[taskId];
       if (!task || task.status !== 'open') return toast('任务已被接走');
       task.status = 'accepted'; task.accepterId = currentUserId;
       const me = dataStore.users[currentUserId];
       const nk = uid();
       if (!dataStore.notifs) dataStore.notifs = {};
       dataStore.notifs[nk] = { userId: task.posterId, message: `🤝 ${me.name} 已接取你的外卖任务（${task.lockerNumber}）`, read: false, createdAt: Date.now() };
       await saveData();
       toast('接单成功！'); refresh();
     }}]);
}

async function completeTask(taskId) {
  if (!currentUserId) return;
  await loadData();
  const t = (dataStore.tasks || {})[taskId];
  if (!t || t.status !== 'accepted' || t.accepterId !== currentUserId) return;

  modal('确认完成', `确认已送达？获得 <strong style="color:#ff3b30;">${t.rewardPoints} 积分</strong>`,
    [{ text:'再等等', cls:'btn-secondary', fn:()=>{} },
     { text:'确认完成', cls:'btn-primary', fn: async () => {
       await loadData();
       const task = (dataStore.tasks || {})[taskId];
       if (!task || task.status !== 'accepted') return;
       task.status = 'completed'; task.completedAt = Date.now();

       const poster = dataStore.users[task.posterId];
       const accepter = dataStore.users[currentUserId];
       if (poster) poster.points = (poster.points || 0) - task.rewardPoints;
       if (accepter) accepter.points = (accepter.points || 0) + task.rewardPoints;

       if (!dataStore.notifs) dataStore.notifs = {};
       const nk1 = uid(); const nk2 = uid();
       dataStore.notifs[nk1] = { userId: task.posterId, message: `✅ ${accepter.name} 已帮你取回外卖（${task.lockerNumber}）`, read: false, createdAt: Date.now() };
       dataStore.notifs[nk2] = { userId: currentUserId, message: `🪙 获得 ${task.rewardPoints} 积分！外卖已送达`, read: false, createdAt: Date.now() };
       await saveData();
       toast('任务完成，积分已到账！'); refresh();
     }}]);
}

async function cancelTask(taskId) {
  if (!currentUserId) return;
  await loadData();
  const t = (dataStore.tasks || {})[taskId];
  if (!t || (t.posterId !== currentUserId && t.accepterId !== currentUserId)) return;

  modal('取消任务',
    t.posterId === currentUserId ? '确认取消你发布的任务？' : '确认放弃接取？',
    [{ text:'再想想', cls:'btn-secondary', fn:()=>{} },
     { text:'确认取消', cls:'btn-danger', fn: async () => {
       await loadData();
       const task = (dataStore.tasks || {})[taskId];
       if (!task) return;
       if (task.accepterId) {
         if (!dataStore.notifs) dataStore.notifs = {};
         const nk = uid();
         dataStore.notifs[nk] = { userId: task.accepterId, message: `⚠️ 任务已被取消（${task.lockerNumber}）`, read: false, createdAt: Date.now() };
       }
       task.status = 'cancelled';
       await saveData();
       toast('任务已取消'); refresh();
     }}]);
}

// ========== MY TASKS ==========
function switchMyTab(tab) {
  myTab = tab;
  document.querySelectorAll('#myPage .segment-btn').forEach((b,i) => b.classList.toggle('active', i === (tab==='posted'?0:1)));
  document.getElementById('myPostedList').classList.toggle('hidden', tab !== 'posted');
  document.getElementById('myAcceptedList').classList.toggle('hidden', tab !== 'accepted');
  renderMy();
}

function renderMy() {
  if (!currentUserId) return;
  const users = dataStore.users || {};
  const tasks = Object.entries(dataStore.tasks || {}).map(([id, t]) => ({ id, ...t })).sort((a,b) => (b.createdAt||0) - (a.createdAt||0));

  const posted = tasks.filter(t => t.posterId === currentUserId && t.status !== 'cancelled');
  const accepted = tasks.filter(t => t.accepterId === currentUserId);

  document.getElementById('myPostedList').innerHTML = posted.length
    ? posted.map(t => renderTaskCard(t, 'posted', users)).join('')
    : '<div class="empty"><div class="empty-icon">📝</div><div class="empty-title">还没有发布过任务</div></div>';

  document.getElementById('myAcceptedList').innerHTML = accepted.length
    ? accepted.map(t => renderTaskCard(t, 'accepted', users)).join('')
    : '<div class="empty"><div class="empty-icon">🤝</div><div class="empty-title">还没有接取过任务</div></div>';
}

function renderTaskCard(t, role, users) {
  const poster = users[t.posterId] || {};
  const accepter = users[t.accepterId] || {};
  const platCls = t.platform === 'eleme' ? 'tag-eleme' : 'tag-meituan';
  let stHtml = '';
  if (t.status === 'open') stHtml = '<span class="status-chip status-open">待接单</span>';
  else if (t.status === 'accepted') stHtml = '<span class="status-chip status-progress">进行中</span>';
  else stHtml = '<span class="status-chip status-done">已完成</span>';

  let actions = '';
  if (role === 'posted' && t.status === 'open') actions = `<button class="action-btn action-cancel" onclick="cancelTask('${t.id}')">取消</button>`;
  else if (role === 'accepted' && t.status === 'accepted') actions = `<button class="action-btn action-complete" onclick="completeTask('${t.id}')">✓ 完成</button><button class="action-btn action-cancel" style="margin-left:6px;" onclick="cancelTask('${t.id}')">放弃</button>`;

  return `<div class="task-card">
    <div class="task-top">
      <span class="platform-tag ${platCls}">${t.platform==='eleme'?'🔵':'🟠'} ${t.platform==='eleme'?'饿了么':'美团'}</span>
      ${stHtml}
      <span class="reward-badge">🪙 ${t.rewardPoints}</span>
    </div>
    <div class="task-detail">
      <span class="task-label">柜箱号</span><span class="task-value">${esc(t.lockerNumber)}</span>
      <span class="task-label">取件码</span><span class="task-value">${esc(t.pickupCode)}</span>
      <span class="task-label">手机号</span><span class="task-value">${esc(t.phone)}</span>
      ${role==='posted'&&t.accepterId?`<span class="task-label">接单人</span><span class="task-value">${esc(accepter.name||'')}</span>`:''}
      ${role==='accepted'?`<span class="task-label">发布人</span><span class="task-value">${esc(poster.name||'')} (${esc(t.phone)})</span>`:''}
    </div>
    <div class="task-bottom"><span class="task-time">${ago(t.createdAt)}</span><div>${actions}</div></div></div>`;
}

// ========== PROFILE ==========
function renderProfile() {
  if (!currentUserId) return;
  const u = (dataStore.users || {})[currentUserId];
  if (!u) return;
  const tasks = Object.values(dataStore.tasks || {});
  const pCount = tasks.filter(t => t.posterId === currentUserId && t.status !== 'cancelled').length;
  const aCount = tasks.filter(t => t.accepterId === currentUserId).length;
  const cCount = tasks.filter(t => t.accepterId === currentUserId && t.status === 'completed').length;

  document.getElementById('profileContent').innerHTML = `
    <div class="profile-card">
      <div class="avatar">${esc(u.name.charAt(0))}</div>
      <div class="profile-name">${esc(u.name)}</div>
      <div class="profile-phone">${u.phone}</div>
      <div class="points-box">🪙 ${u.points} 积分</div>
      <div class="stats">
        <div class="stat"><div class="stat-num">${pCount}</div><div class="stat-label">发布任务</div></div>
        <div class="stat"><div class="stat-num">${aCount}</div><div class="stat-label">接取任务</div></div>
        <div class="stat"><div class="stat-num">${cCount}</div><div class="stat-label">已完成</div></div>
      </div>
    </div>
    <button class="btn btn-secondary" style="margin-bottom:10px;" onclick="toggleShareGuide()">📤 怎么分享给同事</button>
    <button class="btn btn-secondary" style="margin-bottom:10px;" onclick="handleLogout()">切换账号</button>`;
  renderShareGuide();
}

function toggleShareGuide() {
  showingGuide = !showingGuide;
  if (page !== 'profile') go('profile');
  renderShareGuide();
}
function renderShareGuide() {
  const el = document.getElementById('shareGuide');
  if (!showingGuide) { el.classList.add('hidden'); return; }
  el.classList.remove('hidden');
  el.innerHTML = `<div style="background:#fff;border-radius:16px;padding:20px;"><h3 style="font-size:17px;font-weight:700;margin-bottom:6px;">📤 分享给同事</h3><p style="font-size:13px;color:#8e8e93;margin-bottom:16px;">把链接发到公司群即可，多人数据自动同步</p><div class="guide-steps"><div class="guide-step"><div class="guide-num">1</div><div class="guide-text">复制链接发到公司群</div></div><div style="background:#f9f9f9;border-radius:10px;padding:12px 14px;word-break:break-all;font-size:13px;color:#007aff;cursor:pointer;" onclick="copyLink()">${esc(location.href)}</div><div class="guide-step"><div class="guide-num">2</div><div class="guide-text">同事打开后添加到桌面</div></div></div><button class="btn btn-primary" style="margin-top:12px;" onclick="copyLink()">📋 复制链接</button></div>`;
}
function copyLink() { navigator.clipboard ? navigator.clipboard.writeText(location.href).then(() => toast('已复制')) : toast('请手动复制'); }

function handleLogout() {
  modal('切换账号', '确认退出？',
    [{ text:'取消', cls:'btn-secondary', fn:()=>{} },
     { text:'确认退出', cls:'btn-primary', fn:()=>{
       localStorage.removeItem('dqw_uid'); currentUserId = null;
       if (pollTimer) clearInterval(pollTimer);
       document.getElementById('tabBar').classList.add('hidden');
       document.querySelectorAll('.page').forEach(x => x.classList.remove('active'));
       document.getElementById('loginPage').classList.add('active');
       document.getElementById('loginName').value = '';
       document.getElementById('loginPhone').value = '';
       toast('已退出');
     }}]);
}

// ========== NOTIFICATIONS ==========
function toggleNotifPanel() {
  document.getElementById('notifSheet').classList.toggle('open');
  if (document.getElementById('notifSheet').classList.contains('open')) renderNotifs();
}

function renderNotifs() {
  const list = document.getElementById('notifList');
  if (!currentUserId) { list.innerHTML = '<div class="empty"><div class="empty-icon">🔔</div><div class="empty-title">请先登录</div></div>'; return; }

  const notifs = Object.values(dataStore.notifs || {})
    .filter(n => n.userId === currentUserId)
    .sort((a,b) => (b.createdAt||0) - (a.createdAt||0));

  if (!notifs.length) { list.innerHTML = '<div class="empty"><div class="empty-icon">📭</div><div class="empty-title">暂无消息</div></div>'; return; }

  // Mark read
  Object.entries(dataStore.notifs || {}).forEach(([k,n]) => {
    if (n.userId === currentUserId && !n.read) { n.read = true; }
  });
  saveData();

  list.innerHTML = notifs.map(n => `
    <div class="notif-row"><div class="notif-dot seen"></div><div><div class="notif-body">${n.message}</div><div class="notif-date">${ago(n.createdAt)}</div></div></div>`).join('');
}

function updateBadge() {
  if (!currentUserId) { document.getElementById('notifBadge').classList.add('hidden'); return; }
  const count = Object.values(dataStore.notifs || {}).filter(n => n.userId === currentUserId && !n.read).length;
  const badge = document.getElementById('notifBadge');
  if (count > 0) { badge.textContent = count > 99 ? '99+' : count; badge.classList.remove('hidden'); }
  else badge.classList.add('hidden'); }
</script>
